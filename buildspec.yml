version: 0.2

env:
  variables:
    # CodeBuild 프로젝트 환경변수에서 덮어쓰는 것을 권장합니다.
    AWS_REGION: ap-northeast-2
    S3_BUCKET: "www.trycatchlog.com"
    S3_PREFIX: "" # 예: "personal-blog" (비우면 버킷 루트로 배포)
    CLOUDFRONT_DISTRIBUTION_ID: "" # 선택: 넣으면 배포 후 무효화 수행

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Node version:" && node -v
      - echo "NPM version:" && npm -v
      - npm ci
  build:
    commands:
      - npm run build
  post_build:
    commands:
      - |
        if [ -z "$S3_BUCKET" ]; then
          echo "ERROR: S3_BUCKET is empty. Set CodeBuild environment variable S3_BUCKET."
          exit 1
        fi
      - |
        DEST="s3://${S3_BUCKET}"
        if [ -n "$S3_PREFIX" ]; then
          DEST="${DEST%/}/${S3_PREFIX#/}"
        fi
        echo "Deploy destination: ${DEST}"
      # 1) 정적 에셋(해시 파일)은 장기 캐시
      - |
        aws s3 sync dist "${DEST}" \
          --delete \
          --exclude "*" \
          --include "assets/*" \
          --cache-control "public,max-age=31536000,immutable"
      # 2) index.html은 즉시 갱신되도록 캐시 최소화
      - |
        aws s3 cp dist/index.html "${DEST%/}/index.html" \
          --cache-control "no-cache, no-store, must-revalidate" \
          --content-type "text/html; charset=utf-8"
      # 3) 나머지 파일(아이콘/이미지 등)
      - |
        aws s3 sync dist "${DEST}" \
          --delete \
          --exclude "assets/*" \
          --exclude "index.html" \
          --cache-control "public,max-age=86400"
      # 4) CloudFront 무효화(옵션)
      - |
        if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
          echo "Invalidating CloudFront distribution: ${CLOUDFRONT_DISTRIBUTION_ID}"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
        else
          echo "CLOUDFRONT_DISTRIBUTION_ID is empty. Skip invalidation."
        fi

artifacts:
  base-directory: dist
  files:
    - "**/*"

